<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title"><title id="title">Kelvin Wendell — Engenheiro de Software Júnior. Backend, full stack e sistemas confiáveis.</title><style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,monospace}.run{stroke-dasharray:35 650;animation:run 10s linear infinite}.glow{animation:glow 4s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1) infinite}@keyframes run{to{stroke-dashoffset:-685}}@keyframes glow{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.run,.glow,.cursor{animation:none}}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#112e4d"/></linearGradient><radialGradient id="light"><stop stop-color="#347cbb" stop-opacity=".22"/><stop offset="1" stop-color="#347cbb" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8cc8fa" stroke-opacity=".045"/></pattern></defs><rect width="1200" height="390" rx="18" fill="url(#bg)"/><rect width="1200" height="390" rx="18" fill="url(#grid)"/><ellipse cx="1010" cy="140" rx="430" ry="300" fill="url(#light)"/><path d="M0 389H1200" stroke="#438cc0" stroke-opacity=".6"/><rect x="48" y="43" width="4" height="19" rx="2" fill="#63d5cb"/><text x="65" y="58" fill="#9fbcd6" font-size="14" letter-spacing="3">KELVINWENDELL / SOFTWARE ENGINEERING</text><text x="45" y="144" fill="#f0f7ff" font-size="64" font-weight="600" letter-spacing="-2">Kelvin Wendell<tspan class="cursor" fill="#6ad9cd">_</tspan></text><text x="49" y="190" fill="#93c4f1" font-size="25">Engenheiro de Software Júnior</text><text x="49" y="246" fill="#e2edf8" font-size="23">Código com propósito.</text><text x="49" y="280" fill="#a5b9cd" font-size="21">Soluções conectadas ao negócio.</text><text x="49" y="347" fill="#8fa9c2" font-size="15" letter-spacing="1">BACKEND · FULL STACK · MOBILE · IA APLICADA</text><rect x="790" y="82" width="362" height="223" rx="12" fill="#0b1929" stroke="#2c4963"/><path d="M790 119H1152" stroke="#2c4963"/><circle cx="810" cy="101" r="4" fill="#5385aa"/><circle cx="825" cy="101" r="4" fill="#5385aa"/><circle cx="840" cy="101" r="4" fill="#5385aa"/><text class="mono" x="868" y="106" font-size="12" fill="#83a2bd">engineering / mindset</text><g class="mono" font-size="17"><text x="813" y="157" fill="#6bd8cd">understand(problem);</text><text x="813" y="190" fill="#8ebff1">build(solution);</text><text x="813" y="223" fill="#8ebff1">test(behavior);</text><text x="813" y="256" fill="#a8b9ce">improve(continuously);</text></g><path d="M720 160H760V320H1070" fill="none" stroke="#295578"/><path class="run" d="M720 160H760V320H1070" fill="none" stroke="#63d5cb" stroke-width="2"/><circle class="glow" cx="1070" cy="320" r="4" fill="#63d5cb"/></svg>
