<svg xmlns="http://www.w3.org/2000/svg" width="420" height="170" viewBox="0 0 420 170" role="img" aria-labelledby="title"><title id="title">Vamos construir algo que faça sentido.</title><rect width="420" height="170" rx="12" fill="#0d2238"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="48" fill="#ecf5ff" font-size="25" font-weight="600">Vamos construir algo</text><text x="24" y="80" fill="#ecf5ff" font-size="25" font-weight="600">que faça sentido.</text><text x="24" y="120" fill="#a1b9d0" font-size="17">Tecnologia, colaboração</text><text x="24" y="143" fill="#a1b9d0" font-size="17">e aprendizado contínuo.</text></g></svg>
