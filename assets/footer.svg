<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-labelledby="title"><title id="title">Vamos construir algo que faça sentido.</title><style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,monospace}.run{stroke-dasharray:35 650;animation:run 10s linear infinite}.glow{animation:glow 4s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1) infinite}@keyframes run{to{stroke-dashoffset:-685}}@keyframes glow{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.run,.glow,.cursor{animation:none}}</style><defs><linearGradient id="f"><stop stop-color="#102b46"/><stop offset="1" stop-color="#081321"/></linearGradient></defs><rect width="1000" height="110" rx="12" fill="url(#f)"/><path d="M0 109H1000" stroke="#30516d"/><path class="run" d="M0 109H1000" stroke="#63d5cb" stroke-width="2"/><text x="32" y="48" fill="#ecf5ff" font-size="26" font-weight="600">Vamos construir algo que faça sentido.</text><text x="33" y="79" fill="#a1b9d0" font-size="17">Tecnologia, colaboração e aprendizado contínuo.</text></svg>
