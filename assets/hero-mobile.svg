<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" role="img" aria-labelledby="title"><title id="title">Kelvin Wendell — Engenheiro de Software Júnior. Backend, full stack, mobile e IA aplicada.</title><style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,monospace}.run{stroke-dasharray:35 650;animation:run 10s linear infinite}.glow{animation:glow 4s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1) infinite}@keyframes run{to{stroke-dashoffset:-685}}@keyframes glow{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.run,.glow,.cursor{animation:none}}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#112e4d"/></linearGradient><radialGradient id="light"><stop stop-color="#347cbb" stop-opacity=".22"/><stop offset="1" stop-color="#347cbb" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8cc8fa" stroke-opacity=".045"/></pattern></defs><rect width="420" height="360" rx="14" fill="url(#bg)"/><rect width="420" height="360" fill="url(#grid)"/><text x="25" y="43" fill="#91b2cf" font-size="12" letter-spacing="2">SOFTWARE ENGINEERING</text><text x="23" y="107" fill="#f0f7ff" font-size="41" font-weight="600" letter-spacing="-1.5">Kelvin Wendell<tspan class="cursor" fill="#6ad9cd">_</tspan></text><text x="25" y="145" fill="#93c4f1" font-size="20">Engenheiro de Software Júnior</text><text x="25" y="204" fill="#e2edf8" font-size="22">Código com propósito.</text><text x="25" y="237" fill="#a5b9cd" font-size="19">Soluções conectadas ao negócio.</text><path d="M25 273H330V298H395" stroke="#295578" fill="none"/><path class="run" d="M25 273H330V298H395" stroke="#63d5cb" fill="none" stroke-width="2"/><text x="25" y="321" fill="#8fa9c2" font-size="13" letter-spacing=".5">BACKEND / FULL STACK / MOBILE / IA</text></svg>
